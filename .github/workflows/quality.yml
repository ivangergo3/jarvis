name: Jarvis quality

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  scope:
    name: Select and verify change scope
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check whitespace
        run: |
          git show --format= --check HEAD >/dev/null 2>&1 || {
            echo "Whitespace check failed. Run git show --format= --check HEAD locally for details." >&2
            exit 1
          }
      - name: Select verification scope
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          scope=full
          sha_pattern='^[0-9a-f]{40}$'
          case "$GITHUB_EVENT_NAME" in
            pull_request|merge_group)
              if [[ "$BASE" =~ $sha_pattern && "$HEAD" =~ $sha_pattern ]] &&
                 git cat-file -e "$BASE^{commit}"; then
                candidate=$(git rev-parse HEAD)
                git worktree add --detach "$RUNNER_TEMP/jarvis-quality-base" "$BASE"
                cd "$RUNNER_TEMP/jarvis-quality-base"
                if git merge-base --is-ancestor "$BASE" "$candidate"; then
                  scope=$(swift run quality-gate push scope --base="$BASE" --head="$candidate")
                  if [[ "$scope" == docs && "$GITHUB_EVENT_NAME" == pull_request ]]; then
                    scope=$(swift run quality-gate push scope --base="$BASE" --head="$HEAD")
                  fi
                  if [[ "$scope" == docs && "$GITHUB_EVENT_NAME" != pull_request ]]; then
                    swift run quality-gate push integration --base="$BASE" --head="$candidate"
                  fi
                fi
              fi
              ;;
          esac
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Selected verification scope: $scope" >> "$GITHUB_STEP_SUMMARY"

      - name: Check complete PR size and added credentials
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TARGET: ${{ github.event.pull_request.base.ref }}
        run: |
          test "$PR_TARGET" = main || { echo 'PRs must target main for cumulative size enforcement.' >&2; exit 1; }
          cd "$RUNNER_TEMP/jarvis-quality-base"
          swift run quality-gate push ci --base="$PR_BASE" --head="$PR_HEAD"

  swift:
    name: Swift / ${{ matrix.lane }}
    outputs:
      unit: ${{ steps.finished.outputs.unit }}
      hover: ${{ steps.finished.outputs.hover }}
      release: ${{ steps.finished.outputs.release }}
      static: ${{ steps.finished.outputs.static }}
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: unit, runner: macos-15 }
          - { lane: hover, runner: macos-15 }
          - { lane: release, runner: macos-15-intel }
          - { lane: static, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Cache pinned formatter build
        if: matrix.lane == 'static'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/tools
          key: swift-format-${{ runner.os }}-${{ runner.arch }}-xcode16.4-${{ hashFiles('Tools/SwiftFormat/*') }}
      - name: Prepare pinned formatter
        if: matrix.lane == 'static'
        run: ./scripts/format.sh bootstrap
      - name: Run selected Swift checks
        id: fullchecks
        env:
          LANE: ${{ matrix.lane }}
          JARVIS_SWIFT_JOBS: 3
        run: |
          swift build --jobs 3 -Xswiftc -warnings-as-errors --product quality-gate
          gate="$(swift build --show-bin-path)/quality-gate"
          if [[ "$LANE" == static ]]; then
            bash scripts/verify-ci-result.sh
            bash scripts/verify-check-lanes.sh
          fi
          bash scripts/check-lane.sh "$LANE" "$gate"
      - name: Retain bounded test diagnostics
        if: always() && steps.fullchecks.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-diagnostics-${{ matrix.lane }}
          path: test-results/
          retention-days: 7
          if-no-files-found: error
      - name: Record completed Swift lane
        id: finished
        env:
          LANE: ${{ matrix.lane }}
        run: echo "$LANE=$LANE" >> "$GITHUB_OUTPUT"

  native:
    name: Native UI / shard ${{ matrix.shard }}
    outputs:
      shard1: ${{ steps.finished.outputs.shard1 }}
      shard2: ${{ steps.finished.outputs.shard2 }}
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify native UI with synthetic fixtures
        id: nativeui
        env:
          SHARD: ${{ matrix.shard }}
        run: swift run -Xswiftc -warnings-as-errors native-ui-check --shard="$SHARD"
      - name: Retain native UI evidence
        if: always() && steps.nativeui.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ui-evidence-${{ matrix.shard }}
          path: test-results/native-ui/
          retention-days: 7
          if-no-files-found: error
      - name: Record completed native shard
        id: finished
        env:
          SHARD: ${{ matrix.shard }}
        run: echo "shard$SHARD=$SHARD" >> "$GITHUB_OUTPUT"

  typescript:
    name: TypeScript workspace and Vitest
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Check exact-source TypeScript and Vitest evidence
        run: exec bash scripts/ci-typescript.sh "$RUNNER_TEMP/jarvis-typescript"
      - name: Retain qualified synthetic TypeScript report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: typescript-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jarvis-typescript/vitest/qualified.json
          retention-days: 7
          if-no-files-found: error

  desktop:
    name: Packaged Electron / macOS
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Prepare the packaged app's workspace dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -p 'process.versions.node')" = "$(cat .nvmrc)"
          test "pnpm@$(pnpm --version)" = "$(node -p 'require("./package.json").packageManager')"
          pnpm install --frozen-lockfile
          pnpm --filter '@jarvis/client^...' --filter '@jarvis/desktop^...' --if-present run build
      - name: Exercise the signed synthetic Electron preview
        env:
          JARVIS_SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/jarvis-electron-smoke
        run: exec node scripts/desktop/package-mac.mjs --smoke
      - name: Check packaged desktop evidence
        env:
          JARVIS_SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/jarvis-electron-smoke
        run: |
          set -euo pipefail
          for file in workspace.png project.png smoke.json; do
            test -s "$JARVIS_SMOKE_EVIDENCE_DIR/$file"
          done
      - name: Retain packaged desktop screenshots and receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/jarvis-electron-smoke/workspace.png
            ${{ runner.temp }}/jarvis-electron-smoke/project.png
            ${{ runner.temp }}/jarvis-electron-smoke/smoke.json
          retention-days: 7
          if-no-files-found: error

  quality:
    name: macOS build and tests
    needs: [scope, swift, native, typescript, desktop]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check selected for this change
        id: required_result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE: ${{ needs.scope.outputs.scope }}
          SWIFT_RESULT: ${{ needs.swift.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          SWIFT_LANES: ${{ needs.swift.outputs.unit }}/${{ needs.swift.outputs.hover }}/${{ needs.swift.outputs.release }}/${{ needs.swift.outputs.static }}
          NATIVE_SHARDS: ${{ needs.native.outputs.shard1 }}/${{ needs.native.outputs.shard2 }}
          TS_RESULT: ${{ needs.typescript.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          if [[ "$SCOPE" == full ]]; then
            echo "Completed Swift lanes=$SWIFT_LANES, native shards=$NATIVE_SHARDS"
            [[ "$SWIFT_LANES" == unit/hover/release/static && "$NATIVE_SHARDS" == 1/2 ]] || exit 1
          fi
          printf 'Scope=%s (%s), Swift=%s, native UI=%s, TypeScript=%s\n' "$SCOPE" "$SCOPE_RESULT" "$SWIFT_RESULT" "$NATIVE_RESULT" "$TS_RESULT"
          echo "Packaged Electron=$DESKTOP_RESULT"
          case "$SCOPE_RESULT/$SCOPE/$SWIFT_RESULT/$NATIVE_RESULT/$TS_RESULT/$DESKTOP_RESULT" in
            success/full/success/success/success/success|success/docs/skipped/skipped/skipped/skipped) exit 0 ;;
            *) exit 1 ;;
          esac
