name: Jarvis quality

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: macOS build and tests
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check whitespace
        run: git show --format= --check HEAD
      - name: Cache pinned formatter build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/tools
          key: swift-format-${{ runner.os }}-${{ runner.arch }}-xcode16.4-${{ hashFiles('Tools/SwiftFormat/*') }}
      - name: Prepare pinned formatter
        run: ./scripts/format.sh bootstrap
      - name: Check formatting, concurrency gates, tests and macOS 14 release build
        run: ./scripts/check.sh
      - name: Prove hover load gates reject seeded redraw and fanout regressions
        run: swift run -Xswiftc -warnings-as-errors quality-gate hover-fault
      - name: Retain bounded test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-diagnostics
          path: test-results/
          retention-days: 7
          if-no-files-found: error
      - name: Verify app bundle
        run: |
          plutil -lint build/Jarvis.app/Contents/Info.plist
          codesign --verify --deep --strict build/Jarvis.app
          test -x build/Jarvis.app/Contents/MacOS/Jarvis
          test -s build/Jarvis.app/Contents/Resources/reactor.png
          test -s build/Jarvis.app/Contents/Resources/AppIcon.icns
          test -s build/Jarvis.app/Contents/Resources/CompletionChime.wav
          for frame in 0 1 2 3 4 5; do
            test -s "build/Jarvis.app/Contents/Resources/CompanionIdle${frame}.png"
          done
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' build/Jarvis.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSSpeechRecognitionUsageDescription' build/Jarvis.app/Contents/Info.plist
      - name: Verify native UI with synthetic fixtures
        id: nativeui
        run: swift run -Xswiftc -warnings-as-errors native-ui-check
      - name: Retain native UI evidence
        if: always() && steps.nativeui.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ui-evidence
          path: test-results/native-ui/
          retention-days: 7
          if-no-files-found: error
