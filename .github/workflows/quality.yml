name: Jarvis quality

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: macOS build and tests
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check whitespace
        run: git show --format= --check HEAD
      - name: Check complete PR size and added credentials
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TARGET: ${{ github.event.pull_request.base.ref }}
        run: |
          test "$PR_TARGET" = main || { echo 'PRs must target main for cumulative size enforcement.' >&2; exit 1; }
          swift run quality-gate push ci --base="$PR_BASE" --head="$PR_HEAD"
      - name: Cache pinned formatter build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/tools
          key: swift-format-${{ runner.os }}-${{ runner.arch }}-xcode16.4-${{ hashFiles('Tools/SwiftFormat/*') }}
      - name: Prepare pinned formatter
        run: ./scripts/format.sh bootstrap
      - name: Check formatting, concurrency gates, tests and macOS 14 release build
        run: ./scripts/check.sh
      - name: Retain bounded test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-diagnostics
          path: test-results/
          retention-days: 7
          if-no-files-found: error
      - name: Verify native UI with synthetic fixtures
        id: nativeui
        run: swift run -Xswiftc -warnings-as-errors native-ui-check
      - name: Retain native UI evidence
        if: always() && steps.nativeui.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ui-evidence
          path: test-results/native-ui/
          retention-days: 7
          if-no-files-found: error
