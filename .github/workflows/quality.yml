name: Jarvis quality

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: macOS build and tests
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check whitespace
        run: git show --format= --check HEAD
      - name: Run fixture-based tests
        run: swift test
      - name: Build release app for macOS 14 and newer
        run: ./build.sh
      - name: Verify app bundle
        run: |
          plutil -lint build/Jarvis.app/Contents/Info.plist
          codesign --verify --deep --strict build/Jarvis.app
          test -x build/Jarvis.app/Contents/MacOS/Jarvis
          test -s build/Jarvis.app/Contents/Resources/reactor.png
          test -s build/Jarvis.app/Contents/Resources/AppIcon.icns
